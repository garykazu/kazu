<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Threads Shift Studio</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1b2522;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:880px;margin:auto;padding:20px}.hero{padding:26px 4px 12px}.hero h1{font-size:30px;margin:0 0 8px}.hero p{color:#5a6661}.card{background:#fff;border:1px solid #dde4df;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #17231d0a}h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:700;margin:7px 0}input,textarea,select{width:100%;border:1px solid #ccd6cf;border-radius:11px;padding:12px;font:inherit;background:#fbfcfb}textarea{min-height:82px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #b9c8bf;border-radius:999px;padding:9px 12px;background:white;cursor:pointer}.chip.on{background:#173d30;color:white}.actions{display:flex;gap:10px;position:sticky;bottom:8px}.btn{border:0;border-radius:13px;padding:14px 16px;font-weight:800;cursor:pointer}.primary{background:#173d30;color:white;flex:1}.secondary{background:#e7ede9}.result{white-space:pre-wrap;background:#f7faf8;border-radius:12px;padding:14px;margin-top:10px}.small{font-size:12px;color:#68736e}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style></head><body><main class="wrap"><section class="hero"><h1>Threads Shift Studio</h1><p>オーナーの個性 × お客様の暮らし。「掛け算」と「ずらし」で、売り込みすぎない投稿の種をつくります。</p></section>
<section class="card"><h2>1. お店・ブランド</h2><div class="grid"><div><label>ブランド名</label><input id="brand" value="onde"></div><div><label>業種</label><input id="category" value="温浴・ウェルネス"></div></div><label>お店の強み・特徴</label><textarea id="strength">日常から少し離れて、自分の時間を過ごせる場所</textarea></section>
<section class="card"><h2>2. オーナーヒアリング</h2><div class="grid"><div><label>趣味・好きなこと</label><input id="hobby" value="サーフィン"></div><div><label>休日の過ごし方</label><input id="holiday" placeholder="海、音楽、カフェ巡り…"></div></div><label>その趣味の「何」が好き？</label><textarea id="why" placeholder="例：自然の中で頭を空っぽにできる時間"></textarea><label>大切にしている価値観</label><input id="values" placeholder="例：無理をしない、自分の時間、挑戦"><label>お客様にどんな時間を過ごしてほしい？</label><textarea id="wish" placeholder="例：忙しい日常から少し離れて、自分に戻る時間"></textarea><p class="small">趣味そのものを売るのではなく、そこにある感情・価値観を投稿の核にします。</p></section>
<section class="card"><h2>3. お客様のライフスタイル</h2><div class="chips" id="chips"></div><label>その他の暮らし・趣味</label><input id="customLife" placeholder="キャンプ、写真、料理など"></section>
<section class="card"><h2>4. 投稿の方向</h2><div class="grid"><div><label>型</label><select id="tone"><option>共感型</option><option>ストーリー型</option><option>問いかけ型</option><option>気づき型</option></select></div><div><label>投稿数</label><select id="count"><option>3</option><option>5</option></select></div></div></section>
<div class="actions"><button class="btn secondary" onclick="sample()">ondeに戻す</button><button class="btn primary" onclick="generate()">掛け算・ずらしを生成</button></div>
<section class="card" id="outCard" style="display:none"><h2>企画・投稿案</h2><div id="strategy"></div><div id="posts"></div></section></main>
<script>
const lives=['サーフィン・海','仕事・デスクワーク','美容・セルフケア','子育て','音楽','ランニング','ヨガ・運動','旅行','食・カフェ','何もしない休日'];
const selected=new Set(['サーフィン・海','仕事・デスクワーク','美容・セルフケア']);
function draw(){chips.innerHTML=lives.map(x=>'<button class="chip '+(selected.has(x)?'on':'')+'" onclick="toggle(\''+x+'\')">'+x+'</button>').join('')}
function toggle(x){selected.has(x)?selected.delete(x):selected.add(x);draw()}
function v(id){return document.getElementById(id).value.trim()}
function core(){let w=v('why')||'好きなことに集中して、自分に戻れる時間';let val=v('values')||'自分の時間を大切にする';return {w,val}}
function generate(){const b=v('brand')||'この場所',h=v('hobby')||'オーナーの趣味',c=core();let ls=[...selected];if(v('customLife'))ls.push(v('customLife'));if(!ls.length)ls=['日々を忙しく過ごす人'];let count=+v('count');let tone=v('tone');let bridge='「'+h+'」から見つけた '+c.val+' → お客様それぞれの暮らしへずらす';strategy.innerHTML='<div class="result"><b>今回の軸</b>\n'+bridge+'\n\n<b>大切なルール</b>\n趣味の一致を求めず、共通する感情・時間・価値観で '+b+' につなげます。</div>';let arr=[];for(let i=0;i<count;i++){let life=ls[i%ls.length];let hook=tone==='問いかけ型'?'あなたが「自分に戻れる」のは、どんな時間ですか？':tone==='ストーリー型'?'オーナーにとって'+h+'は、ただの趣味ではありません。':tone==='気づき型'?'好きなことが違っても、欲しい時間は案外似ている。':'人によって、整う時間は違う。';arr.push('<div class="result"><b>案 '+(i+1)+'｜'+life+' × '+b+'</b>\n'+hook+'\n\n'+h+'が好きな人も、'+life+'を楽しむ人も。\n共通しているのは「'+c.w+'」なのかもしれません。\n\n'+b+'も、誰かの決めた過ごし方ではなく、自分のペースを取り戻す場所でありたい。\n\n今日は、あなたならどんなふうに過ごしますか？</div>')}posts.innerHTML=arr.join('');outCard.style.display='block';outCard.scrollIntoView({behavior:'smooth'})}
function sample(){brand.value='onde';category.value='温浴・ウェルネス';strength.value='日常から少し離れて、自分の時間を過ごせる場所';hobby.value='サーフィン';holiday.value='';why.value='';values.value='';wish.value='';selected.clear();['サーフィン・海','仕事・デスクワーク','美容・セルフケア'].forEach(x=>selected.add(x));draw()}
draw();
</script></body></html>
